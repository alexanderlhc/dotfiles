general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid multiple instances
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action="on"})'  # avoid needing a second keypress to wake
}

# Warn 30s before the lock. This machine is a desktop with no backlight
# (no /sys/class/backlight entry), so the warning is a notification rather
# than a dim. Cleared on resume via the id captured from `notify-send -p`.
listener {
    timeout = 570
    on-timeout = notify-send -u critical -t 30000 -p -a hypridle "Locking in 30s" "Move the mouse to stay awake" > /tmp/hypridle-warn.id
    on-resume = dunstctl close "$(cat /tmp/hypridle-warn.id 2>/dev/null)" 2>/dev/null; rm -f /tmp/hypridle-warn.id
}

# Lock after 10 min idle
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Screens off after 15 min idle
listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action="off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action="on"})'
}
