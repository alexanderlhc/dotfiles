source = ~/.config/hypr/themes/hyprlock-colors.conf

general {
    hide_cursor = true
}

background {
    monitor =
    color = $bg
}

label {
    monitor =
    text = cmd[update:1000] date '+%Y-%m-%d %H:%M'
    color = $dim
    font_family = monospace
    font_size = 16
    position = 0, 40
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:0] echo "$USER@$(hostname) \$"
    color = $fg
    font_family = monospace
    font_size = 16
    position = -130, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 220, 26
    outline_thickness = 0
    rounding = 0
    inner_color = $bg
    outer_color = $bg
    font_color = $fg
    check_color = $accent
    fail_color = $red
    fail_text = denied
    dots_size = 0.3
    dots_center = false
    fade_on_empty = false
    placeholder_text =
    position = 40, 0
    halign = center
    valign = center
}
