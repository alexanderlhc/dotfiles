onboarding = false

[experimental]
pane_history = false

[theme]
name = "terminal"
auto_switch = false

[ui]
agent_panel_sort = "priority"
prompt_new_tab_name = false
status_indicators = "symbols"

[ui.toast]
delivery = "system"

[ui.sound]
enabled = false

[keys]
# Tabs are the "one level up" version of pane nav: ctrl+hjkl moves panes,
# ctrl+shift+h/l moves tabs, matching <S-h>/<S-l> in nvim. This frees
# prefix+p (see the plan command below) and prefix+n, and hands
# prefix+shift+tab back to cycle_pane_previous.
previous_tab = "ctrl+shift+h"
next_tab = "ctrl+shift+l"
cycle_pane_previous = "prefix+shift+tab"

# nvim's :tabmove
move_tab_previous = "ctrl+shift+alt+h"
move_tab_next = "ctrl+shift+alt+l"

# Third level: workspaces
switch_workspace = "prefix+shift+1..9"
previous_workspace = "ctrl+shift+k"
next_workspace = "ctrl+shift+j"

# Agents: alt+1 = top of the priority queue
focus_agent = "alt+1..9"
next_agent = "prefix+a"
previous_agent = "prefix+shift+a"
last_pane = "prefix+tab"

# Worktrees — prefix+shift+g goes through new-worktree.sh, which slugifies
# spaces into the branch name (the built-in prompt rejects them).
new_worktree = ""
open_worktree = "prefix+shift+o"
remove_worktree = "prefix+shift+k"

[[keys.command]]
key = "prefix+shift+g"
type = "popup"
command = "/home/alexander/.config/herdr/bin/new-worktree.sh"
width = 60
height = 6

# Project picker: fzf over open workspaces, worktrees and ~/code repos.
[[keys.command]]
key = "prefix+f"
type = "popup"
command = "/home/alexander/.config/herdr/bin/project-picker.sh"
width = "80%"
height = "70%"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+p"
type = "shell"
command = "/home/alexander/.config/herdr/bin/open-plan.sh"

# --- vim-tmux-navigator, for herdr -------------------------------------
# ctrl+h/j/k/l moves between panes; herdr-nav.sh passes the key through
# instead when the focused pane runs vim/nvim/fzf.
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = "/home/alexander/.config/herdr/bin/herdr-nav.sh left"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = "/home/alexander/.config/herdr/bin/herdr-nav.sh down"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = "/home/alexander/.config/herdr/bin/herdr-nav.sh up"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = "/home/alexander/.config/herdr/bin/herdr-nav.sh right"

# ctrl+l is taken globally now, so keep clear-screen reachable
# (mirrors `bind C-l send-keys 'C-l'` in ~/.config/tmux/tmux.conf).
[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = "/home/alexander/.config/herdr/bin/herdr-send-key.sh ctrl+l"
# tinty-begin
[theme.custom]
red = "#bf0021"
yellow = "#a06d00"
# tinty-end
