<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- System UI font: change here only. Apps use the generic families. -->
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Libron</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Libron</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Libertinus Mono</family><family>Symbols Nerd Font</family></prefer>
  </alias>
</fontconfig>
