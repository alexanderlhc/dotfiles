# FROZEN FALLBACK — this is NOT the live config.
#
# Hyprland reads hyprland.lua when it exists; these hyprlang files are a
# snapshot taken at the Lua migration (0694846, 2026-09-02) and are no longer
# kept in sync. New binds, rules and settings go in the .lua files only.
#
# To fall back:  mv hyprland.lua hyprland.lua.off  &&  hyprctl reload
# To retire the snapshot once the Lua config has proven itself:
#   dotconfig rm .config/hypr/hyprland.conf .config/hypr/conf.d/*.conf
# (hypridle.conf and hyprlock.conf are still live hyprlang — do not remove.)

# Hyprland config — split into conf.d/, see https://wiki.hypr.land/Configuring/

source = ~/.config/hypr/conf.d/monitors.conf
source = ~/.config/hypr/conf.d/programs.conf
source = ~/.config/hypr/conf.d/autostart.conf
source = ~/.config/hypr/conf.d/env.conf
source = ~/.config/hypr/conf.d/look-and-feel.conf
source = ~/.config/hypr/themes/current.conf
source = ~/.config/hypr/conf.d/input.conf
source = ~/.config/hypr/conf.d/keybindings.conf
source = ~/.config/hypr/conf.d/window-rules.conf
